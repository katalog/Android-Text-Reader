name: Release Sync Server

# sync-server-v로 시작하는 태그(sync-server-v1.0.0 등)를 push하면 실행된다 — 안드로이드 앱 릴리스
# 워크플로우(release.yml, "v*" 태그)와 네임스페이스가 안 겹치게 접두사를 분리했다
# (.docs/PC_SYNC_SERVER_PLAN.md 참고). Windows용 exe라도 CGO를 안 쓰는 순수 Go라 크로스 컴파일이
# 되므로 ubuntu-latest에서 GOOS=windows로 그냥 빌드한다 — 굳이 windows-latest 러너를 쓸 필요 없음.
on:
  push:
    tags:
      - "sync-server-v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: external_library/sync_server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: external_library/sync_server/go.mod

      - name: Compute release version
        id: version
        run: echo "name=${GITHUB_REF_NAME#sync-server-v}" >> "$GITHUB_OUTPUT"

      # -H=windowsgui: 콘솔 창 없이 트레이 아이콘으로만 뜨게. CGO_ENABLED=0은 기본값이라 명시 안 해도
      # 되지만, 순수 Go라는 전제를 워크플로우에서도 눈에 보이게 남겨둠.
      - name: Build Windows exe
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: 0
        run: |
          mkdir -p ../../release-artifacts
          go build -ldflags="-H=windowsgui" \
            -o "../../release-artifacts/moonkata-sync-server-${{ steps.version.outputs.name }}.exe" .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*.exe
          generate_release_notes: true
