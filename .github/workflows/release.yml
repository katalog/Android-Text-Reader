name: Release

# v로 시작하는 태그(v1.0, v1.2.3 등)를 push하면 실행된다: 유닛 테스트를 돌리고, 통과하면 릴리스
# 키스토어(레포 시크릿에 base64로 저장)로 서명한 APK를 빌드해서 그 태그 이름으로 된 GitHub Release를
# 만들고 APK를 첨부한다. RELEASE_KEYSTORE_BASE64 시크릿이 없으면 build.gradle.kts가 조용히 디버그
# 서명으로 폴백한다(포크 등에서도 워크플로우 자체는 깨지지 않음). SUPABASE_URL/SUPABASE_PUBLISHABLE_KEY
# 시크릿도 같은 이유로 없으면 빈 값으로 빌드되고, 그 경우 VSCode 동기화 기능만 조용히 비활성화된다
# (SYNC_MULTIUSER_PLAN.md 스테이지 3).
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # AGP 8.12(build.gradle.kts의 android-application 플러그인)는 그레이들을 돌리는 JDK 자체가
      # 17 이상이어야 한다 — 앱 코드가 targeting하는 compileOptions/kotlinOptions의 Java 11과는
      # 별개(그건 컴파일 바이트코드 타깃일 뿐, 그레이들/AGP 실행 환경 요구사항이 아님).
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # 계측 테스트(app/src/androidTest)는 에뮬레이터가 필요하고 그중 일부(RealFontDownloadIntegrationTest,
      # FontApplyRepaginatesViewerTest)는 실제 인터넷으로 외부 폰트 배포처에 접속하는 테스트라, 릴리스를
      # 막는 게이트로 CI에서 돌리기엔 너무 느리고 불안정하다. 순수 로직 유닛 테스트(app/src/test)만으로
      # 릴리스를 게이트한다.
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Decode release keystore
        run: echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > release.keystore

      # 태그(v1.1 → "1.1")를 versionName으로, 계속 늘어나기만 하는 CI 실행 번호를 versionCode로
      # 쓴다 — 태그와 무관하게 build.gradle.kts에 박힌 고정값이 그대로 APK에 들어가던 게 원래
      # 버그였다(Obtainium 등에서 보이는 "최신 태그"와 설치된 앱의 실제 버전 표시가 어긋남).
      - name: Compute release version
        id: version
        run: |
          echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "code=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        env:
          RELEASE_KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_VERSION_NAME: ${{ steps.version.outputs.name }}
          RELEASE_VERSION_CODE: ${{ steps.version.outputs.code }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: ./gradlew assembleRelease

      - name: Remove decoded keystore
        if: always()
        run: rm -f release.keystore

      - name: Rename APK with version
        run: |
          mkdir -p release-artifacts
          cp app/build/outputs/apk/release/app-release.apk \
             "release-artifacts/android-text-reader-${GITHUB_REF_NAME}.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*.apk
          generate_release_notes: true
          # 태그 이름에 -beta가 있으면(예: v1.5.0-beta.1) GitHub이 "Pre-release" 배지를 붙인다.
          prerelease: ${{ contains(github.ref_name, '-beta') }}
